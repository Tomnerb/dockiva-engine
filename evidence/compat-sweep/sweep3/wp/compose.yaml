services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pw
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
  wordpress:
    image: wordpress:php8.3-apache
    depends_on: [db]
    ports: ["28120:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
